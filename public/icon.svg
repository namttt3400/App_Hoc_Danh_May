<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="primaryKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#6366f1"/>
      <stop offset="100%" stopColor="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Keyboard Chassis Outer Rim -->
  <rect x="56" y="96" width="400" height="320" rx="40" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  <rect x="68" y="108" width="376" height="296" rx="30" fill="#090d16"/>

  <!-- Row 1: Top keys -->
  <rect x="92" y="132" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="146" y="132" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="200" y="132" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="254" y="132" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="308" y="132" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="362" y="132" width="58" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Row 2: Home Row (with F and J illuminated) -->
  <rect x="92" y="190" width="50" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="152" y="190" width="42" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="204" y="190" width="42" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Key F (Home Row Anchor with Tactile Bump) -->
  <rect x="256" y="190" width="46" height="46" rx="12" fill="url(#primaryKeyGrad)" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
  <text x="279" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">F</text>
  <rect x="268" y="226" width="22" height="3" rx="1.5" fill="#facc15"/>

  <!-- Key J (Home Row Anchor with Tactile Bump) -->
  <rect x="312" y="190" width="46" height="46" rx="12" fill="url(#accentKeyGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <text x="335" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">J</text>
  <rect x="324" y="226" width="22" height="3" rx="1.5" fill="#facc15"/>

  <rect x="368" y="190" width="52" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Row 3: Bottom keys -->
  <rect x="92" y="252" width="60" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="162" y="252" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="214" y="252" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="266" y="252" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="318" y="252" width="42" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="370" y="252" width="50" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Row 4: Spacebar -->
  <rect x="156" y="310" width="200" height="44" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="2.5"/>
  <text x="256" y="337" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">10 NGÓN</text>
</svg>
